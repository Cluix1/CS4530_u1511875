ont-family="monospace" font-size="17" fill="#c5c8cc">            val source = readBitmap(applicationContext, inputData.getString(KEY_IMAGE_URI))</text><text x="18" y="548" font-family="monospace" font-size="17" fill="#777d82">49</text><text x="100" y="548" font-family="monospace" font-size="17" fill="#c5c8cc">            var current = source.copy(Bitmap.Config.ARGB_8888, true)</text><text x="18" y="573" font-family="monospace" font-size="17" fill="#777d82">50</text><text x="100" y="573" font-family="monospace" font-size="17" fill="#c5c8cc">            repeat(level) {</text><text x="18" y="598" font-family="monospace" font-size="17" fill="#777d82">51</text><text x="100" y="598" font-family="monospace" font-size="17" fill="#c5c8cc">                val next = boxBlur(current, 7)</text><text x="18" y="623" font-family="monospace" font-size="17" fill="#777d82">52</text><text x="100" y="623" font-family="monospace" font-size="17" fill="#c5c8cc">                current.recycle()</text><text x="18" y="648" font-family="monospace" font-size="17" fill="#777d82">53</text><text x="100" y="648" font-family="monospace" font-size="17" fill="#c5c8cc">                current = next</text><text x="18" y="673" font-family="monospace" font-size="17" fill="#777d82">54</text><text x="100" y="673" font-family="monospace" font-size="17" fill="#c5c8cc">            }</text><text x="18" y="698" font-family="monospace" font-size="17" fill="#777d82">55</text><text x="100" y="698" font-family="monospace" font-size="17" fill="#c5c8cc">            val uri = saveBitmap(applicationContext, current)</text><text x="18" y="723" font-family="monospace" font-size="17" fill="#777d82">56</text><text x="100" y="723" font-family="monospace" font-size="17" fill="#c5c8cc">            Result.success(Data.Builder().putString(KEY_IMAGE_URI, uri.toString()).build())</text><text x="18" y="748" font-family="monospace" font-size="17" fill="#777d82">57</text><text x="100" y="748" font-family="monospace" font-size="17" fill="#c5c8cc">        } catch (e: Exception) {</text><text x="18" y="773" font-family="monospace" font-size="17" fill="#777d82">58</text><text x="100" y="773" font-family="monospace" font-size="17" fill="#c5c8cc">            Result.failure()</text><text x="18" y="798" font-family="monospace" font-size="17" fill="#777d82">59</text><text x="100" y="798" font-family="monospace" font-size="17" fill="#c5c8cc">        }</text><text x="18" y="823" font-family="monospace" font-size="17" fill="#777d82">60</text><text x="100" y="823" font-family="monospace" font-size="17" fill="#c5c8cc">    }</text><text x="18" y="848" font-family="monospace" font-size="17" fill="#777d82">61</text><text x="100" y="848" font-family="monospace" font-size="17" fill="#c5c8cc">}</text><text x="1450" y="860" text-anchor="end" font-family="Arial" font-size="12" fill="#777">CODE PREVIEW</text></svg>